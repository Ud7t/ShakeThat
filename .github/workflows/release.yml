name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches app version
        run: |
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $APP_VERSION in Resources/Info.plist"
            exit 1
          fi
      - name: Test
        run: swift test
      - name: Bundle app
        run: |
          ./scripts/build-app.sh
          ditto -c -k --keepParent build/ShakeThat.app "build/ShakeThat-$GITHUB_REF_NAME.zip"
      # Attaches the zip to the release for this tag. If the release was made on GitHub first,
      # the zip is added to it; otherwise a draft release is created to review and publish.
      - name: Attach app to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="build/ShakeThat-$GITHUB_REF_NAME.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --generate-notes --draft
          fi
