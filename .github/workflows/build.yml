name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle app
        run: |
          ./scripts/build-app.sh
          ditto -c -k --keepParent build/ShakeThat.app build/ShakeThat.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ShakeThat
          path: build/ShakeThat.zip
